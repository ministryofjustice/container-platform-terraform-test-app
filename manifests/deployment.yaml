apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world-deployment
  namespace: starter-pack
  labels:
    app: hello-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
        - name: hello-world
          image: ministryofjustice/helloworld-go:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
